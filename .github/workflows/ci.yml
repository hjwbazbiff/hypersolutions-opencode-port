name: Verify OpenCode port

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Audit pinned upstream source
        run: |
          git clone https://github.com/Hyper-Solutions/hypersolutions-codex.git .work/upstream
          node scripts/sync-upstream.mjs --source .work/upstream --check

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm pack
      - name: Reject private inputs in the package
        shell: bash
        run: |
          tar -tzf hypersolutions-opencode-0.2.0.tgz > package-files.txt
          if grep -Ei '(^|/)(proxies[^/]*\.txt|\.env[^/]*|\.work|node_modules|research)(/|$)|\.har$' package-files.txt; then
            exit 1
          fi
      - name: Install pinned OpenCode runtimes
        run: |
          npm install --prefix .work/opencode-v2 @opencode/cli@2.0.24 --no-audit --no-fund
          npm install --prefix .work/runtime opencode-ai@1.18.35 --no-audit --no-fund
      - name: Native OpenCode 2 integration
        run: OPENCODE_V2_BIN="$PWD/.work/opencode-v2/node_modules/.bin/opencode" npm run test:integration:v2 -- ./hypersolutions-opencode-0.2.0.tgz
      - name: Native OpenCode 1 integration
        run: npm run test:integration -- ./hypersolutions-opencode-0.2.0.tgz
